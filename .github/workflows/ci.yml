name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

  database:
    name: Migrations, RLS tests, generated types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the local Postgres image, then applies every migration and the
      # seed to a fresh database.
      - run: pnpm db:start

      - run: pnpm db:test

      - name: Content pipeline against the database
        run: pnpm --filter @oathly/content test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/oathly?sslmode=disable

      - name: Check generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- packages/api/src/database.types.ts
