name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Bundles the phone app for both platforms with Metro. Catches what
      # typecheck cannot: a module that only resolves in the browser build.
      - name: Bundle the mobile app for iOS and Android
        run: pnpm --filter @oathly/mobile bundle
        env:
          EXPO_PUBLIC_API_URL: https://oathly.invalid
          EXPO_PUBLIC_NEON_AUTH_URL: https://auth.oathly.invalid

      - name: No secrets in the phone app's bundles
        run: node scripts/security/client-bundles.mjs apps/mobile/dist

  database:
    name: Migrations, RLS tests, generated types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the local Postgres image, then applies every migration and the
      # seed to a fresh database.
      - run: pnpm db:start

      - run: pnpm db:test

      # With the database up, the API package is held to its coverage
      # thresholds (packages/api/vitest.config.ts).
      - name: Content pipeline and learner data against the database
        run: |
          pnpm --filter @oathly/content test &
          content=$!
          pnpm --filter @oathly/api test:coverage
          wait "$content"
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/oathly?sslmode=disable

      - name: Check generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- packages/api/src/database.types.ts

  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/oathly?sslmode=disable
      # Marker values, not secrets: the build runs with them set, and the check
      # after it fails if any of them is in a file a browser downloads. Only
      # variables that do not make the build call a service are given one.
      ANTHROPIC_API_KEY: marker-anthropic-key-not-for-clients
      NEON_AUTH_COOKIE_SECRET: marker-cookie-secret-not-for-clients-0000
      REVALIDATE_SECRET: marker-revalidate-secret-not-for-clients-00
      ADMIN_PASSWORD: marker-admin-password-not-for-clients
      MAILTRAP_TOKEN: marker-mailtrap-token-not-for-clients
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The public pages are built from the database, so it has to be up
      # (migrated and seeded) before the build.
      - run: pnpm db:start

      # The seed's questions are unreviewed, so it has nothing published. The
      # made-up country from the browser checks has: with it the pages measured
      # below carry sample questions and topic pages, as the real ones will.
      - name: Add a country with published questions
        run: docker compose -f db/local/compose.yaml exec -T db psql -v ON_ERROR_STOP=1 -q -U postgres -d oathly < apps/web/e2e/fixture.sql

      - run: pnpm --filter @oathly/web build

      - name: No secrets in what browsers download
        run: node scripts/security/client-bundles.mjs apps/web/.next/static

      - name: Start the production server
        run: |
          pnpm --filter @oathly/web start > web.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat web.log
          exit 1

      # The budgets in CLAUDE.md. Where the app does not meet one yet, the
      # check fails on getting worse than today and warns about the target:
      # see the limits in js-budget.mjs and lighthouserc.mobile.json.
      - name: Landing JS before 3D
        run: node apps/web/scripts/perf/js-budget.mjs

      - name: Lighthouse, mobile
        run: apps/web/scripts/perf/lighthouse.sh mobile

      - name: Lighthouse, desktop
        run: apps/web/scripts/perf/lighthouse.sh desktop

      # Shared runners are several times slower than a laptop, so the time
      # limit is looser here than the 100 ms the app is held to locally. The
      # check that the route was prefetched (no wait on the server) is exact.
      - name: Prefetched navigation
        run: |
          pnpm --filter @oathly/web exec playwright install --with-deps chromium
          node apps/web/scripts/perf/navigation.mjs
        env:
          NAV_BUDGET_MS: 300

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: apps/web/lighthouse-reports
          retention-days: 14

  e2e:
    name: Browser tests and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Migrations and the seed, then the made-up country the tests use.
      - run: pnpm db:start

      - name: Add the test country
        run: docker compose -f db/local/compose.yaml exec -T db psql -v ON_ERROR_STOP=1 -q -U postgres -d oathly < apps/web/e2e/fixture.sql

      - run: pnpm --filter @oathly/web exec playwright install --with-deps chromium

      # Playwright starts a development server of its own (the test sign-in
      # exists only there) and runs every flow, then axe on every page in
      # both themes: any WCAG 2.1 A or AA violation fails.
      - name: Playwright and axe
        run: pnpm --filter @oathly/web e2e
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/oathly?sslmode=disable

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/e2e/report
            apps/web/e2e/results
          retention-days: 14
