packages:
  - apps/*
  - packages/*

# One version of each shared tool across the workspace. React is pinned to the
# version the Expo SDK ships with: both apps must resolve the same React.
catalog:
  '@eslint/js': ^9.39.5
  '@types/node': ^24.19.0
  '@types/react': ~19.2.2
  '@types/react-dom': ~19.2.2
  eslint: ^9.39.5
  eslint-config-prettier: ^10.1.8
  react: 19.2.3
  react-dom: 19.2.3
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  vitest: ^5.0.3

allowBuilds:
  # Copies Skia's prebuilt native libraries into place for native builds.
  '@shopify/react-native-skia': true
  # Sentry's command-line tool, only used to upload source maps. Its install
  # script fetches a binary; the platform package it depends on already has it.
  '@sentry/cli': false
  core-js: false
  esbuild: false
  sharp: false
  unrs-resolver: false

# Optional peer of react-native's CLI plugin; without this pnpm auto-installs
# the latest release instead of the one matching react-native.
overrides:
  '@react-native/metro-config': 0.86.3

minimumReleaseAgeExclude:
  - '@sentry/browser-utils@11.5.0'
  - '@sentry/browser@11.5.0'
  - '@sentry/bundler-plugins@11.5.0'
  - '@sentry/core@11.5.0'
  - '@sentry/feedback@11.5.0'
  - '@sentry/nextjs@11.5.0'
  - '@sentry/node@11.5.0'
  - '@sentry/opentelemetry@11.5.0'
  - '@sentry/react@11.5.0'
  - '@sentry/replay-canvas@11.5.0'
  - '@sentry/replay@11.5.0'
  - '@sentry/server-runtime-injection@11.5.0'
  - '@sentry/server-utils@11.5.0'
  - '@sentry/vercel-edge@11.5.0'
  - '@playwright/test@1.64.0'
  - playwright-core@1.64.0
  - playwright@1.64.0
