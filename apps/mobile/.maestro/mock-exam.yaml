# Completes a mock exam on a phone: from the dashboard, through every
# question, to the results.
#
#   maestro test .maestro/mock-exam.yaml \
#     -e APP_ID=host.exp.Exponent -e APP_URL=exp://<your-computer-ip>:8081
#
# APP_ID is Expo Go: host.exp.Exponent on iOS, host.exp.exponent on Android.
# The app must be running with a test session (see README.md), so there is no
# sign-in to get through. shared/open.yaml opens the app and gets to the Study tab.
appId: ${APP_ID}
---
- runFlow: shared/open.yaml

- scrollUntilVisible:
    element:
      id: 'mock-exam-.*'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'mock-exam-.*'
    index: 0

- extendedWaitUntil:
    visible:
      id: 'audio-mode'
    timeout: 30000

# An exam that is spoken in real life opens as a mock interview: the question
# is asked aloud and its text is out of sight. This flow answers by tapping,
# so it switches audio mode off, which brings back the written form.
- runFlow:
    when:
      visible:
        id: 'show-question'
    commands:
      - tapOn:
          id: 'audio-mode'

- extendedWaitUntil:
    visible:
      id: 'question-text'
    timeout: 30000

# Answer every question. A mock exam gives no feedback between questions; one
# that stops early (when the result is certain) simply reaches the results sooner.
- repeat:
    while:
      notVisible:
        id: 'results'
    commands:
      - tapOn:
          id: 'option-0'
      - tapOn:
          id: 'next'

- assertVisible:
    id: 'results'
- assertVisible:
    id: 'back-to-study'
- tapOn:
    id: 'back-to-study'
- assertVisible:
    id: 'practise-.*'
